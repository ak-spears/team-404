# TechDocs config — The Process builds these docs from this repo (techdocs-ref: dir:.)
# and serves them in the catalog's Docs tab.
# site_description uses the D-106 `dump` filter, not hand-quoting: a single-quoted
# YAML scalar breaks the instant the free-text description itself contains an
# apostrophe (e.g. "Team's capstone project" — ordinary English), which the old
# 'A UA-MIS capstone VM project.' form did not escape.
site_name: 'team-404'
site_description: "A UA-MIS capstone VM project."

nav:
  - Home: index.md
  - Architecture: architecture.md
  - File storage deploy: file-storage-deploy.md
  - Manual deploy: manual-deploy.md
  - Manual secrets: manual-secrets.md

plugins:
  - techdocs-core
