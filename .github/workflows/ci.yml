# ci.yml -- the APP's CI: install -> typecheck -> lint -> build.
#
# Scope: this workflow only proves the TypeScript workspace is healthy. It builds no
# container image and pushes nothing -- packaging this app is the coursework, not the
# starting point. The VM manifests are validated separately by build-and-push.yaml.
#
# No test job exists yet. "Green" means install+typecheck+lint+build only.
#
# RUNNER: same per-team seam as build-and-push.yaml -- the repo Actions variable
# RUNNER_SCALE_SET picks this team's ARC scale set; unset -> the shared `ua-mis-kaniko`
# pool. (That name is just the scale set's name; nothing here runs Kaniko.)
#
# CONTAINER-MODE REQUIREMENT: the ARC scale set is containerMode:kubernetes -- every
# job MUST declare a `container:` or the runner hard-fails at "Set up job".
# node:22-alpine matches this repo's own Node version (package.json engines: >=22).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.RUNNER_SCALE_SET || 'ua-mis-kaniko' }}
    container:
      image: node:22-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable corepack + activate the pinned pnpm version
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
