name: crimson-copies

# Local-dev infrastructure only -- MySQL, MinIO, and Mailpit. Application services
# (orders-api, etc.) are not built as images here; they run via `pnpm --filter <app> dev`
# against this infra.

services:
  orders-api:
    profiles: [apps]
    build: { context: ., dockerfile: apps/orders-api/Dockerfile }
    depends_on: { mysql: { condition: service_healthy } }
    environment:
      HOST: "0.0.0.0"
      PORT: "4000"
      DATABASE_URL: mysql://crimson_copies:devpassword@mysql:3306/crimson_copies
      INTERNAL_API_KEY: dev-internal-key-change-me
      NOTIFY_URL: http://notify:4100
      # team-404: orders-api also talks to MinIO, so it needs the MinIO settings too.
      # Copy the MINIO_* variable names from apps/orders-api/src/lib/storage.ts and src/config.ts.
    ports: ["4000:4000"]
  notify:
    profiles: [apps]
    build: { context: ., dockerfile: services/notify/Dockerfile }
    environment: { HOST: "0.0.0.0", PORT: "4100", INTERNAL_API_KEY: dev-internal-key-change-me }
  storefront:
    profiles: [apps]
    build: { context: ., dockerfile: apps/storefront/Dockerfile }
    environment:
      PORT: "3000"
      ORDERS_API_URL: http://orders-api:4000
      INTERNAL_API_KEY: dev-internal-key-change-me
      SESSION_SECRET: dev-storefront-session-secret
    ports: ["3000:3000"]
  staff-console:
    profiles: [apps]
    build: { context: ., dockerfile: apps/staff-console/Dockerfile }
    environment:
      PORT: "3001"
      ORDERS_API_URL: http://orders-api:4000
      INTERNAL_API_KEY: dev-internal-key-change-me
      SESSION_SECRET: dev-staff-session-secret
    ports: ["3001:3001"]
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crimson_copies}
      MYSQL_USER: ${MYSQL_USER:-crimson_copies}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-devroot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  minio-data:
  mailpit-data:
